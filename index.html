<body> 
	<div id="fb-root"></div>
	<input id="musicPicker" class="audioPicker" type="file" accept="audio/*,.mp3,.ogg,.wav,.m4a,.flac" />
	<input id="sfxPicker" class="audioPicker" type="file" accept="audio/*,.mp3,.ogg,.wav,.m4a,.flac" />
	
	<script>

		// Check for running exported on file protocol
		if (window.location.protocol.substr(0, 4) === "file")
		{
			alert("Exported games won't work until you upload them. (When running on the file:/// protocol, browsers block many features from working for security reasons.)");
		}
	})();
	</script>
	
	<!-- The canvas must be inside a div called c2canvasdiv -->
	<div id="c2canvasdiv">

		ID the runtime looks for in the jQuery events above (ready() and cr_sizeCanvas()). -->

			You can change it, but it is a good idea to link to a description of a browser
			and provide some links to download some popular HTML5-compatible browsers. -->

			<a href="http://www.mozilla.com/firefox/">Mozilla Firefox</a><br/>
			<a href="http://www.google.com/chrome/">Google Chrome</a><br/>
			<a href="http://www.apple.com/safari/download/">Apple Safari</a></h1>
		</canvas>
		
	</div>
	
	<!-- Pages load faster with scripts at the bottom -->
	
	<!-- Construct 2 exported games require jQuery. -->
	<script src="jquery-3.4.1.min.js"></script>


	<script>
	(function () {
		var storageKey = "badTimeSettings";
		var dbName = "badTimeAudio";
		var storeName = "files";

		var settings = {
			noHit: false,
			changeMusic: false,
			changeSfx: false,
			sabiMode: false
		};

		// Object URLs for the player's own music/SFX, restored from IndexedDB on load.
		var customUrl = {
			music: "",
			sfx: ""
		};

		try {
			var saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
			Object.assign(settings, saved);
		} catch (e) {}

		var params = new URLSearchParams(window.location.search);

		function readFlag(name) {
			return /^(1|true|on|yes)$/i.test(params.get(name) || "");
		}

		if (params.has("NoHit"))
			settings.noHit = readFlag("NoHit");
		if (params.has("SaBiMode") || params.has("sabimode") || params.has("sabi"))
			settings.sabiMode = readFlag("SaBiMode") || readFlag("sabimode") || readFlag("sabi");
		if (params.has("ChangeMusic"))
			settings.changeMusic = readFlag("ChangeMusic");
		if (params.has("ChangeSFX"))
			settings.changeSfx = readFlag("ChangeSFX");

		window.BadTimeSettings = settings;
		window.SaBiMode = settings.sabiMode;

		function save() {
			try {
				localStorage.setItem(storageKey, JSON.stringify(settings));
			} catch (e) {}
		}

		// The in-game settings menu builds its labels out of Browser.QueryParam(),
		// so the query string is what it reads back. Keep it in sync, and spell the
		// values ON/OFF so the menu can show them as they are.
		function settingsUrl(menu) {
			var url = new URL(window.location.href);
			url.searchParams.set("NoHit", settings.noHit ? "ON" : "OFF");
			url.searchParams.set("SaBiMode", settings.sabiMode ? "ON" : "OFF");
			url.searchParams.set("ChangeMusic", settings.changeMusic ? "ON" : "OFF");
			url.searchParams.set("ChangeSFX", settings.changeSfx ? "ON" : "OFF");
			url.searchParams.delete("sabimode");
			url.searchParams.delete("sabi");

			if (menu)
				url.searchParams.set("menu", menu);
			else
				url.searchParams.delete("menu");

			return url.toString();
		}

		function applyUrl(menu) {
			try {
				window.history.replaceState(null, "", settingsUrl(menu));
			} catch (e) {}
		}

		// The runtime caches audio buffers under the URL it first asked for, so an
		// audio swap only takes effect on a fresh load. Come back to the settings
		// menu afterwards.
		function reloadInto(menu) {
			save();
			window.location.replace(settingsUrl(menu));
		}

		applyUrl(params.get("menu"));

		function rewriteAudioUrl(url) {
			if (typeof url !== "string")
				return url;

			return url.replace(/(^|\/)media\/([^\/?#]+\.(?:ogg|m4a))([?#].*)?$/i, function (match, prefix, file, suffix) {
				var isMusic = /^mus_/i.test(file);
				if (isMusic && settings.changeMusic && customUrl.music)
					return customUrl.music;
				if (!isMusic && settings.changeSfx && customUrl.sfx)
					return customUrl.sfx;
				if (!settings.sabiMode)
					return match;

				return prefix + "sabi_media/" + file + (suffix || "");
			});
		}

		var originalOpen = XMLHttpRequest.prototype.open;
		XMLHttpRequest.prototype.open = function (method, url) {
			arguments[1] = rewriteAudioUrl(url);
			return originalOpen.apply(this, arguments);
		};

		if (window.fetch) {
			var originalFetch = window.fetch;
			window.fetch = function (input, init) {
				if (typeof input === "string")
					input = rewriteAudioUrl(input);
				else if (input && input.url)
					input = new Request(rewriteAudioUrl(input.url), input);

				return originalFetch.call(this, input, init);
			};
		}

		// Sound effects are fetched with XHR, but music is streamed through an
		// <audio> element that never touches XHR or fetch - without this hook the
		// music is never swapped.
		var srcProp = window.HTMLMediaElement && Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, "src");
		if (srcProp && srcProp.set) {
			Object.defineProperty(HTMLMediaElement.prototype, "src", {
				configurable: true,
				enumerable: srcProp.enumerable,
				get: srcProp.get,
				set: function (value) {
					srcProp.set.call(this, rewriteAudioUrl(value));
				}
			});
		}

		function openDb() {
			return new Promise(function (resolve, reject) {
				if (!window.indexedDB) {
					reject(new Error("no IndexedDB"));
					return;
				}

				var request = indexedDB.open(dbName, 1);
				request.onupgradeneeded = function () {
					request.result.createObjectStore(storeName);
				};
				request.onsuccess = function () {
					resolve(request.result);
				};
				request.onerror = request.onblocked = function () {
					reject(request.error);
				};
			});
		}

		function readCustomAudio() {
			return openDb().then(function (db) {
				return new Promise(function (resolve) {
					var transaction = db.transaction(storeName, "readonly");
					var store = transaction.objectStore(storeName);

					Object.keys(customUrl).forEach(function (key) {
						var request = store.get(key);
						request.onsuccess = function () {
							if (request.result)
								customUrl[key] = URL.createObjectURL(request.result);
						};
					});

					transaction.oncomplete = transaction.onerror = transaction.onabort = function () {
						db.close();
						resolve();
					};
				});
			});
		}

		function writeCustomAudio(key, blob) {
			return openDb().then(function (db) {
				return new Promise(function (resolve, reject) {
					var transaction = db.transaction(storeName, "readwrite");
					var store = transaction.objectStore(storeName);

					if (blob)
						store.put(blob, key);
					else
						store.delete(key);

					transaction.oncomplete = function () {
						db.close();
						resolve();
					};
					transaction.onerror = transaction.onabort = function () {
						db.close();
						reject(transaction.error);
					};
				});
			});
		}

		function clearCustom(key, flag) {
			function done() {
				reloadInto("settings");
			}

			settings[flag] = false;
			if (customUrl[key]) {
				URL.revokeObjectURL(customUrl[key]);
				customUrl[key] = "";
			}

			writeCustomAudio(key, null).then(done, done);
		}

		function onPicked(key, flag) {
			return function () {
				var file = this.files && this.files[0];
				this.value = "";
				if (!file)
					return;

				settings[flag] = true;
				writeCustomAudio(key, file).then(function () {
					reloadInto("settings");
				}, function () {
					// Nowhere to persist it - keep the pick for this session only.
					if (customUrl[key])
						URL.revokeObjectURL(customUrl[key]);
					customUrl[key] = URL.createObjectURL(file);
					save();
					applyUrl(null);
				});
			};
		}

		// Called from the in-game settings menu (Browser: Execute Javascript).
		window.BadTimeSettingsUI = {
			enter: function () {
				applyUrl(null);
			},
			toggleNoHit: function () {
				settings.noHit = !settings.noHit;
				save();
				applyUrl(null);
			},
			toggleSabi: function () {
				settings.sabiMode = !settings.sabiMode;
				window.SaBiMode = settings.sabiMode;
				reloadInto("settings");
			},
			toggleMusic: function () {
				if (settings.changeMusic)
					clearCustom("music", "changeMusic");
				else
					document.getElementById("musicPicker").click();
			},
			toggleSfx: function () {
				if (settings.changeSfx)
					clearCustom("sfx", "changeSfx");
				else
					document.getElementById("sfxPicker").click();
			}
		};

		document.getElementById("musicPicker").addEventListener("change", onPicked("music", "changeMusic"));
		document.getElementById("sfxPicker").addEventListener("change", onPicked("sfx", "changeSfx"));

		// The runtime must not start loading audio before the custom files are back.
		window.BadTimeAudioReady = readCustomAudio().catch(function () {});
	})();
	</script>

	
    <!-- The runtime script.  You can rename it, but don't forget to rename the reference here as well.
    This file will have been minified and obfuscated if you enabled "Minify script" during export. -->
	<script src="c2runtime.js"></script>

    <script>
		// Start the Construct 2 project running on window load.
		jQuery(document).ready(function ()
		{
			// Wait for any custom audio to come back out of IndexedDB, but never let
			// a broken database stop the game from starting.
			var ready = window.BadTimeAudioReady || Promise.resolve();
			Promise.race([ready, new Promise(function (resolve) { setTimeout(resolve, 3000); })])
			.then(function ()
			{
				// Create new runtime using the c2canvas
				cr_createRuntime("c2canvas");
			});
		});
		
		// Pause and resume on page becoming visible/invisible
		function onVisibilityChanged() {
			if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden)
				cr_setSuspended(true);
			else
				cr_setSuspended(false);
		};
		
		document.addEventListener("visibilitychange", onVisibilityChanged, false);
		document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("msvisibilitychange", onVisibilityChanged, false);
		
		function OnRegisterSWError(e)
		{
			console.warn("Failed to register service worker: ", e);
		};
		
		// Runtime calls this global method when ready to start caching (i.e. after startup).
		// This registers the service worker which caches resources for offline support.
		window.C2_RegisterSW = function C2_RegisterSW()
		{
			if (!navigator.serviceWorker)
				return;		// no SW support, ignore call
			
			try {
				navigator.serviceWorker.register("sw.js", { scope: "./" })
				.then(function (reg)
				{
					console.log("Registered service worker on " + reg.scope);
				})
				.catch(OnRegisterSWError);
			}
			catch (e)
			{
				OnRegisterSWError(e);
			}
		};
    </script>
