<head>

	<title>Bad Time Simulator (Sans Fight)</title>
	<meta name="description" content="do you wanna have a bad time? 'cause if you visit this page... you are REALLY not going to like what happens next." />

	<link rel="shortcut icon" sizes="256x256" href="icon-256.png" />

    <!-- All margins and padding must be zero for the canvas to fill the screen. -->
	<style type="text/css">
		* {
			padding: 0;
			margin: 0;
		}
		html, body {
			background: #000;
			color: #fff;
			overflow: hidden;
			touch-action: none;
			-ms-touch-action: none;
		}
		canvas {
			touch-action-delay: none;
			touch-action: none;
			-ms-touch-action: none;
		}
		#settingsButton {
			position: fixed;
			top: 10px;
			right: 10px;
			z-index: 20;
			border: 2px solid #fff;
			background: #000;
			color: #fff;
			font: 16px Arial, sans-serif;
			padding: 7px 12px;
			cursor: pointer;
		}
		#settingsPanel {
			position: fixed;
			top: 50px;
			right: 10px;
			z-index: 21;
			width: 220px;
			border: 2px solid #fff;
			background: #050505;
			color: #fff;
			font: 16px Arial, sans-serif;
			padding: 12px;
			display: none;
		}
		#settingsPanel.open {
			display: block;
		}
		#settingsPanel h2 {
			font-size: 18px;
			font-weight: 700;
			margin: 0 0 10px;
		}
		.settingRow {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			min-height: 34px;
		}
		.settingRow input {
			width: 20px;
			height: 20px;
		}
    </style>
	

</head> 
 
<body> 
	<div id="fb-root"></div>
	<button id="settingsButton" type="button">Settings</button>
	<div id="settingsPanel">
		<h2>Settings</h2>
		<label class="settingRow">
			<span>NoHit</span>
			<input id="settingNoHit" type="checkbox" />
		</label>
		<label class="settingRow">
			<span>Change Music</span>
			<input id="settingChangeMusic" type="checkbox" />
		</label>
		<label class="settingRow">
			<span>Change SFX</span>
			<input id="settingChangeSfx" type="checkbox" />
		</label>
		<label class="settingRow">
			<span>SabiMode</span>
			<input id="settingSabiMode" type="checkbox" />
		</label>
	</div>
	
	<script>
	// Issue a warning if trying to preview an exported project on disk.
	(function(){
		// Check for running exported on file protocol
		if (window.location.protocol.substr(0, 4) === "file")
		{
			alert("Exported games won't work until you upload them. (When running on the file:/// protocol, browsers block many features from working for security reasons.)");
		}
	})();
	</script>
	
	<!-- The canvas must be inside a div called c2canvasdiv -->
	<div id="c2canvasdiv">
	
		<!-- The canvas the project will render to.  If you change its ID, don't forget to change the
		ID the runtime looks for in the jQuery events above (ready() and cr_sizeCanvas()). -->
		<canvas id="c2canvas" width="640" height="480">
			<!-- This text is displayed if the visitor's browser does not support HTML5.
			You can change it, but it is a good idea to link to a description of a browser
			and provide some links to download some popular HTML5-compatible browsers. -->

			<br/><br/><a href="http://www.microsoft.com/windows/internet-explorer/default.aspx">Microsoft Internet Explorer</a><br/>
			<a href="http://www.mozilla.com/firefox/">Mozilla Firefox</a><br/>
			<a href="http://www.google.com/chrome/">Google Chrome</a><br/>
			<a href="http://www.apple.com/safari/download/">Apple Safari</a></h1>
		</canvas>
		
	</div>
	
	<!-- Pages load faster with scripts at the bottom -->
	
	<!-- Construct 2 exported games require jQuery. -->
	<script src="jquery-3.4.1.min.js"></script>


	<script>
	(function () {
		var storageKey = "badTimeSettings";
		var params = new URLSearchParams(window.location.search);
		var settings = {
			noHit: false,
			changeMusic: true,
			changeSfx: true,
			sabiMode: false
		};

		try {
			var saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
			Object.assign(settings, saved);
		} catch (e) {}

		function readFlag(name) {
			var value = params.get(name);
			return /^(1|true|on|yes)$/i.test(value || "");
		}

		if (params.has("NoHit"))
			settings.noHit = readFlag("NoHit");
		if (params.has("SaBiMode") || params.has("sabimode") || params.has("sabi"))
			settings.sabiMode = readFlag("SaBiMode") || readFlag("sabimode") || readFlag("sabi");
		if (params.has("ChangeMusic"))
			settings.changeMusic = readFlag("ChangeMusic");
		if (params.has("ChangeSFX"))
			settings.changeSfx = readFlag("ChangeSFX");

		window.BadTimeSettings = settings;
		window.SaBiMode = settings.sabiMode;

		if (settings.noHit && params.get("NoHit") !== "1") {
			params.set("NoHit", "1");
			window.location.replace(window.location.pathname + "?" + params.toString() + window.location.hash);
			return;
		}

		function rewriteAudioUrl(url) {
			if (typeof url !== "string")
				return url;

			if (!settings.sabiMode)
				return url;

			return url.replace(/(^|\/)media\/([^\/?#]+\.ogg)([?#].*)?$/i, function (match, prefix, file, suffix) {
				var isMusic = file.toLowerCase() === "mus_zz_megalovania.ogg";
				if ((isMusic && !settings.changeMusic) || (!isMusic && !settings.changeSfx))
					return match;

				return prefix + "sabi_media/" + file + (suffix || "");
			});
		}

		var originalOpen = XMLHttpRequest.prototype.open;
		XMLHttpRequest.prototype.open = function (method, url) {
			arguments[1] = rewriteAudioUrl(url);
			return originalOpen.apply(this, arguments);
		};

		if (window.fetch) {
			var originalFetch = window.fetch;
			window.fetch = function (input, init) {
				if (typeof input === "string")
					input = rewriteAudioUrl(input);
				else if (input && input.url)
					input = new Request(rewriteAudioUrl(input.url), input);

				return originalFetch.call(this, input, init);
			};
		}

		jQuery(function () {
			var panel = document.getElementById("settingsPanel");
			var button = document.getElementById("settingsButton");
			var controls = {
				noHit: document.getElementById("settingNoHit"),
				changeMusic: document.getElementById("settingChangeMusic"),
				changeSfx: document.getElementById("settingChangeSfx"),
				sabiMode: document.getElementById("settingSabiMode")
			};

			Object.keys(controls).forEach(function (key) {
				controls[key].checked = !!settings[key];
			});

			button.addEventListener("click", function (event) {
				event.stopPropagation();
				panel.classList.toggle("open");
			});

			panel.addEventListener("click", function (event) {
				event.stopPropagation();
			});

			document.addEventListener("click", function () {
				panel.classList.remove("open");
			});

			function applySettings() {
				Object.keys(controls).forEach(function (key) {
					settings[key] = controls[key].checked;
				});
				localStorage.setItem(storageKey, JSON.stringify(settings));

				var next = new URL(window.location.href);
				next.searchParams.set("NoHit", settings.noHit ? "1" : "0");
				next.searchParams.set("SaBiMode", settings.sabiMode ? "1" : "0");
				next.searchParams.set("ChangeMusic", settings.changeMusic ? "1" : "0");
				next.searchParams.set("ChangeSFX", settings.changeSfx ? "1" : "0");
				window.location.replace(next.toString());
			}

			Object.keys(controls).forEach(function (key) {
				controls[key].addEventListener("change", applySettings);
			});
		});
	})();
	</script>

	
    <!-- The runtime script.  You can rename it, but don't forget to rename the reference here as well.
    This file will have been minified and obfuscated if you enabled "Minify script" during export. -->
	<script src="c2runtime.js"></script>

    <script>
		// Start the Construct 2 project running on window load.
		jQuery(document).ready(function ()
		{			
			// Create new runtime using the c2canvas
			cr_createRuntime("c2canvas");
		});
		
		// Pause and resume on page becoming visible/invisible
		function onVisibilityChanged() {
			if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden)
				cr_setSuspended(true);
			else
				cr_setSuspended(false);
		};
		
		document.addEventListener("visibilitychange", onVisibilityChanged, false);
		document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("msvisibilitychange", onVisibilityChanged, false);
		
		function OnRegisterSWError(e)
		{
			console.warn("Failed to register service worker: ", e);
		};
		
		// Runtime calls this global method when ready to start caching (i.e. after startup).
		// This registers the service worker which caches resources for offline support.
		window.C2_RegisterSW = function C2_RegisterSW()
		{
			if (!navigator.serviceWorker)
				return;		// no SW support, ignore call
			
			try {
				navigator.serviceWorker.register("sw.js", { scope: "./" })
				.then(function (reg)
				{
					console.log("Registered service worker on " + reg.scope);
				})
				.catch(OnRegisterSWError);
			}
			catch (e)
			{
				OnRegisterSWError(e);
			}
		};
    </script>

</body>
