	<!-- Pages load faster with scripts at the bottom -->
	
	<!-- Construct 2 exported games require jQuery. -->

	<script>
	(function () {
		var storageKey = "badTimeSettings";
		var dbName = "badTimeAudio";
		var storeName = "files";

		var settings = {
			noHit: false,
			infHp: false,
			noHeal: false,
			noKr: false,
			love: 19,
			randomAttack: false,
			adhd: false,
			tas: false,
			seed: 0,
			fps: 60,
			changeMusic: false,
			changeSfx: false,
			sabiMode: false
		};

		// Object URLs for the player's own music/SFX, restored from IndexedDB on load.
		var customUrl = {
			music: "",
			sfx: ""
		};

		try {
			var saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
			Object.assign(settings, saved);
		} catch (e) {}

		var params = new URLSearchParams(window.location.search);

		function readFlag(name) {
			return /^(1|true|on|yes)$/i.test(params.get(name) || "");
		}

		function clamp(value, low, high, fallback) {
			value = parseInt(value, 10);
			if (!isFinite(value))
				return fallback;
			return Math.min(high, Math.max(low, value));
		}

		if (params.has("NoHit"))
			settings.noHit = readFlag("NoHit");
		if (params.has("InfHP"))
			settings.infHp = readFlag("InfHP");
		if (params.has("NoHeal"))
			settings.noHeal = readFlag("NoHeal");
		if (params.has("NoKR"))
			settings.noKr = readFlag("NoKR");
		if (params.has("RandomAttack"))
			settings.randomAttack = readFlag("RandomAttack");
		if (params.has("ADHD"))
			settings.adhd = readFlag("ADHD");
		if (params.has("TAS"))
			settings.tas = readFlag("TAS");
		if (params.has("SaBiMode") || params.has("sabimode") || params.has("sabi"))
			settings.sabiMode = readFlag("SaBiMode") || readFlag("sabimode") || readFlag("sabi");
		if (params.has("ChangeMusic"))
			settings.changeMusic = readFlag("ChangeMusic");
		if (params.has("ChangeSFX"))
			settings.changeSfx = readFlag("ChangeSFX");
		if (params.has("LOVE"))
			settings.love = clamp(params.get("LOVE"), 1, 99, settings.love);
		if (params.has("FPS"))
			settings.fps = clamp(params.get("FPS"), 10, 240, settings.fps);
		if (params.has("Seed"))
			settings.seed = clamp(params.get("Seed"), 0, 999999, settings.seed);

		settings.love = clamp(settings.love, 1, 99, 19);
		settings.fps = clamp(settings.fps, 10, 240, 60);
		settings.seed = clamp(settings.seed, 0, 999999, 0);

		window.BadTimeSettings = settings;
		window.SaBiMode = settings.sabiMode;

		function save() {
			try {
				localStorage.setItem(storageKey, JSON.stringify(settings));
			} catch (e) {}
		}

		// The in-game settings menu builds its labels out of Browser.QueryParam(),
		// and the battle reads the flags the same way, so the query string is the
		// channel into the game. ON/OFF so the menu can show values as they are.
		function settingsUrl(extra) {
			var url = new URL(window.location.href);
			url.searchParams.set("NoHit", settings.noHit ? "ON" : "OFF");
			url.searchParams.set("InfHP", settings.infHp ? "ON" : "OFF");
			url.searchParams.set("NoHeal", settings.noHeal ? "ON" : "OFF");
			url.searchParams.set("NoKR", settings.noKr ? "ON" : "OFF");
			url.searchParams.set("LOVE", String(settings.love));
			url.searchParams.set("RandomAttack", settings.randomAttack ? "ON" : "OFF");
			url.searchParams.set("ADHD", settings.adhd ? "ON" : "OFF");
			url.searchParams.set("TAS", settings.tas ? "ON" : "OFF");
			url.searchParams.set("Seed", String(settings.seed));
			url.searchParams.set("FPS", String(settings.fps));
			url.searchParams.set("SaBiMode", settings.sabiMode ? "ON" : "OFF");
			url.searchParams.set("ChangeMusic", settings.changeMusic ? "ON" : "OFF");
			url.searchParams.set("ChangeSFX", settings.changeSfx ? "ON" : "OFF");
			url.searchParams.delete("sabimode");
			url.searchParams.delete("sabi");

			["menu", "cmd", "attackurl"].forEach(function (key) {
				if (extra && extra[key])
					url.searchParams.set(key, extra[key]);
				else
					url.searchParams.delete(key);
			});

			return url.toString();
		}

		function applyUrl(extra) {
			try {
				window.history.replaceState(null, "", settingsUrl(extra));
			} catch (e) {}
		}

		// The runtime caches audio buffers under the URL it first asked for, so an
		// audio swap only takes effect on a fresh load. Come back to the settings
		// menu afterwards.
		function reloadIntoSettings() {
			save();
			window.location.replace(settingsUrl({ menu: "settings" }));
		}

		applyUrl({ menu: params.get("menu") });

		// ---- randomness -----------------------------------------------------
		// Construct 2's random() and choose() both come off Math.random, so
		// replacing it with a seeded generator makes every roll reproducible - which
		// is what TAS mode needs, and what "pseudo random" means here.
		var randomState = 0;

		function reseed() {
			randomState = (settings.seed + 0x9E3779B9) >>> 0;
		}

		Math.random = function () {
			randomState = (randomState + 0x6D2B79F5) >>> 0;
			var t = Math.imul(randomState ^ (randomState >>> 15), 1 | randomState);
			t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
			return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
		};

		reseed();

		// ---- frame pacing ---------------------------------------------------
		// The fight is dt driven, so handing the runtime a fixed 1/60s step and
		// pacing the ticks ourselves is what makes the frame rate decide how fast
		// everything actually runs - the player, sans' attacks and frame damage.
		var hardMode = false;
		var nativeRaf = window.requestAnimationFrame && window.requestAnimationFrame.bind(window);
		var nativeCancel = window.cancelAnimationFrame && window.cancelAnimationFrame.bind(window);
		var pacedFrame = false;
		var lastFrameMode = "native";
		var frameClock = 0;
		var frameDue = 0;
		var frameStep = 1000 / 60;

		function nowMs() {
			return (window.performance && performance.now) ? performance.now() : Date.now();
		}

		// Hard mode never drops below 90 FPS, but a higher setting still wins.
		function effectiveFps() {
			var fps = settings.fps || 60;
			if (hardMode && fps < 90)
				fps = 90;
			return fps;
		}

		function scheduleFrame(callback) {
			if (effectiveFps() === 60 && nativeRaf) {
				pacedFrame = false;
				return nativeRaf(callback);
			}

			pacedFrame = true;
			var real = nowMs();
			if (!frameDue || Math.abs(real - frameDue) > 250)
				frameDue = real;
			frameDue += 1000 / effectiveFps();
			frameClock = (frameClock || real) + frameStep;

			var stamp = frameClock;
			return setTimeout(function () {
				callback(stamp);
			}, Math.max(0, frameDue - real));
		};

		// ---- TAS ------------------------------------------------------------
		// While it holds the loop the runtime only gets a frame when ] asks for
		// one, so whatever else is held down is what that frame sees.
		var tas = { inBattle: false, pending: null, handle: 1, stepping: false, timer: 0, media: [] };

		function tasHolding() {
			return settings.tas && tas.inBattle;
		}

		function freezeMedia(element) {
			try {
				element.playbackRate = 0;
			} catch (e) {
				// no rate of zero here, so pause it and remember that we did
				if (!element.paused) {
					element.badTimePaused = true;
					try { element.pause(); } catch (e2) {}
				}
			}
		}

		function thawMedia(element) {
			try { element.playbackRate = 1; } catch (e) {}

			// Only restart what we stopped ourselves - never what the fight did.
			if (element.badTimePaused) {
				element.badTimePaused = false;
				try { element.play(); } catch (e) {}
			}
		}

		// Nothing from the fight should still be playing once we are back on the
		// menu.
		function stopMedia() {
			tas.media.forEach(function (element) {
				element.badTimePaused = false;
				try { element.playbackRate = 1; } catch (e) {}
				try {
					element.pause();
					element.currentTime = 0;
				} catch (e) {}
			});
			tas.media.length = 0;
		}

		function stepMedia() {
			tas.media.forEach(function (element) {
				try {
					if (!element.ended && element.readyState > 0)
						element.currentTime += frameStep / 1000;
				} catch (e) {}
			});
		}

		function tasStep() {
			if (!tasHolding() || !tas.pending || tas.stepping)
				return;

			tas.stepping = true;
			var callback = tas.pending;
			tas.pending = null;
			frameClock = (frameClock || nowMs()) + frameStep;
			stepMedia();
			try {
				callback(frameClock);
			} finally {
				tas.stepping = false;
			}
		}

		// Music is an <audio> element running on its own clock; catch every one
		// that starts so it can be walked forward a frame at a time instead.
		if (window.HTMLMediaElement) {
			var mediaPlay = HTMLMediaElement.prototype.play;
			HTMLMediaElement.prototype.play = function () {
				if (tas.media.indexOf(this) === -1)
					tas.media.push(this);

				var result = mediaPlay.apply(this, arguments);
				if (tasHolding())
					freezeMedia(this);
				return result;
			};
		}

		window.requestAnimationFrame = function (callback) {
			if (tasHolding()) {
				lastFrameMode = "tas";
				tas.pending = callback;
				return tas.handle++;
			}

			lastFrameMode = pacedFrame ? "timer" : "native";
			var id = scheduleFrame(callback);
			lastFrameMode = pacedFrame ? "timer" : "native";
			return id;
		};

		window.cancelAnimationFrame = function (id) {
			if (lastFrameMode === "tas")
				tas.pending = null;
			else if (lastFrameMode === "timer")
				clearTimeout(id);
			else if (nativeCancel)
				nativeCancel(id);
		};

		function tasSync() {
			if (tasHolding()) {
				tas.media.forEach(freezeMedia);
				return;
			}

			tas.media.forEach(thawMedia);
			clearInterval(tas.timer);
			tas.timer = 0;

			// Hand any frame still waiting back to the normal loop, or it stops.
			if (tas.pending) {
				var callback = tas.pending;
				tas.pending = null;
				scheduleFrame(callback);
			}
		}

		window.BadTimeTAS = {
			setBattle: function (on) {
				tas.inBattle = !!on;
				if (!tas.inBattle)
					stopMedia();
				tasSync();
			},
			step: tasStep,
			isHolding: tasHolding
		};

		// ---- audio ----------------------------------------------------------
		function rewriteAudioUrl(url) {
			if (typeof url !== "string")
				return url;

			return url.replace(/(^|\/)media\/([^\/?#]+\.(?:ogg|m4a))([?#].*)?$/i, function (match, prefix, file, suffix) {
				var isMusic = /^mus_/i.test(file);
				if (isMusic && settings.changeMusic && customUrl.music)
					return customUrl.music;
				if (!isMusic && settings.changeSfx && customUrl.sfx)
					return customUrl.sfx;
				if (!settings.sabiMode)
					return match;

				return prefix + "sabi_media/" + file + (suffix || "");
			});
		}

		var originalOpen = XMLHttpRequest.prototype.open;
		XMLHttpRequest.prototype.open = function (method, url) {
			arguments[1] = rewriteAudioUrl(url);
			return originalOpen.apply(this, arguments);
		};

		if (window.fetch) {
			var originalFetch = window.fetch;
			window.fetch = function (input, init) {
				if (typeof input === "string")
					input = rewriteAudioUrl(input);
				else if (input && input.url)
					input = new Request(rewriteAudioUrl(input.url), input);

				return originalFetch.call(this, input, init);
			};
		}

		// Sound effects are fetched with XHR, but music is streamed through an
		// <audio> element that never touches XHR or fetch - without this hook the
		// music is never swapped.
		var srcProp = window.HTMLMediaElement && Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, "src");
		if (srcProp && srcProp.set) {
			Object.defineProperty(HTMLMediaElement.prototype, "src", {
				configurable: true,
				enumerable: srcProp.enumerable,
				get: srcProp.get,
				set: function (value) {
					srcProp.set.call(this, rewriteAudioUrl(value));
				}
			});
		}

		function openDb() {
			return new Promise(function (resolve, reject) {
				if (!window.indexedDB) {
					reject(new Error("no IndexedDB"));
					return;
				}

				var request = indexedDB.open(dbName, 1);
				request.onupgradeneeded = function () {
					request.result.createObjectStore(storeName);
				};
				request.onsuccess = function () {
					resolve(request.result);
				};
				request.onerror = request.onblocked = function () {
					reject(request.error);
				};
			});
		}

		function readCustomAudio() {
			return openDb().then(function (db) {
				return new Promise(function (resolve) {
					var transaction = db.transaction(storeName, "readonly");
					var store = transaction.objectStore(storeName);

					Object.keys(customUrl).forEach(function (key) {
						var request = store.get(key);
						request.onsuccess = function () {
							if (request.result)
								customUrl[key] = URL.createObjectURL(request.result);
						};
					});

					transaction.oncomplete = transaction.onerror = transaction.onabort = function () {
						db.close();
						resolve();
					};
				});
			});
		}

		function writeCustomAudio(key, blob) {
			return openDb().then(function (db) {
				return new Promise(function (resolve, reject) {
					var transaction = db.transaction(storeName, "readwrite");
					var store = transaction.objectStore(storeName);

					if (blob)
						store.put(blob, key);
					else
						store.delete(key);

					transaction.oncomplete = function () {
						db.close();
						resolve();
					};
					transaction.onerror = transaction.onabort = function () {
						db.close();
						reject(transaction.error);
					};
				});
			});
		}

		function clearCustom(key, flag) {
			function done() {
				reloadIntoSettings();
			}

			settings[flag] = false;
			if (customUrl[key]) {
				URL.revokeObjectURL(customUrl[key]);
				customUrl[key] = "";
			}

			writeCustomAudio(key, null).then(done, done);
		}

		function onPicked(key, flag) {
			return function () {
				var file = this.files && this.files[0];
				this.value = "";
				if (!file)
					return;

				settings[flag] = true;
				writeCustomAudio(key, file).then(function () {
					reloadIntoSettings();
				}, function () {
					// Nowhere to persist it - keep the pick for this session only.
					if (customUrl[key])
						URL.revokeObjectURL(customUrl[key]);
					customUrl[key] = URL.createObjectURL(file);
					save();
					applyUrl();
				});
			};
		}

		function toggle(name) {
			settings[name] = !settings[name];
			save();
			applyUrl();
		}

		function ask(message, current, low, high) {
			var answer = window.prompt(message, String(current));
			if (answer === null)
				return current;
			return clamp(answer, low, high, current);
		}

		// ---- hotkeys --------------------------------------------------------
		// The battle polls "cmd" out of the query string every tick; drop it again
		// shortly afterwards so a keypress outside a fight cannot linger.
		var cmdTimer = 0;

		function sendCommand(name, extra) {
			var params = { cmd: name };
			Object.assign(params, extra);
			applyUrl(params);
			clearTimeout(cmdTimer);
			cmdTimer = setTimeout(function () {
				applyUrl();
			}, 400);
		}

		var hotkeys = {
			82: "retry",     // R
			27: "menu",      // escape
			221: "skip"      // ]
		};

		document.addEventListener("keydown", function (event) {
			if (event.ctrlKey || event.altKey || event.metaKey)
				return;
			if (window.BadTimeAttackMaker && window.BadTimeAttackMaker.isOpen())
				return;
			if (/^(input|textarea|select)$/i.test((event.target && event.target.tagName) || ""))
				return;

			if (event.keyCode === 221 && tasHolding()) {
				event.preventDefault();
				if (event.repeat)
					return;   // the browser's repeat is far too quick, use our own

				tasStep();
				clearInterval(tas.timer);
				tas.timer = setInterval(tasStep, 100);   // ten frames a second held
				return;
			}

			if (event.repeat)
				return;
			var command = hotkeys[event.keyCode];
			if (!command)
				return;

			event.preventDefault();
			sendCommand(command);

			// Frozen, the battle would never look at the command. Give it a few
			// frames - enough for leaving to reach the menu, which thaws the loop.
			if (tasHolding()) {
				tasStep();
				setTimeout(tasStep, 32);
				setTimeout(tasStep, 64);
			}
		});

		document.addEventListener("keyup", function (event) {
			if (event.keyCode === 221) {
				clearInterval(tas.timer);
				tas.timer = 0;
			}
		});

		// Called from the game (Browser: Execute Javascript).
		window.BadTimeSettingsUI = {
			enter: function () {
				applyUrl();
			},
			sendCommand: sendCommand,
			clearCmd: function () {
				clearTimeout(cmdTimer);
				applyUrl();
			},
			setHardMode: function (on) {
				hardMode = !!on;
			},
			toggleNoHit: function () {
				toggle("noHit");
			},
			toggleInfHp: function () {
				toggle("infHp");
			},
			toggleNoHeal: function () {
				toggle("noHeal");
			},
			toggleNoKr: function () {
				toggle("noKr");
			},
			toggleRandomAttack: function () {
				toggle("randomAttack");
			},
			toggleAdhd: function () {
				toggle("adhd");
			},
			toggleTas: function () {
				settings.tas = !settings.tas;
				save();
				applyUrl();
				tasSync();
			},
			setSeed: function () {
				settings.seed = ask("Random seed (0-999999)", settings.seed, 0, 999999);
				save();
				applyUrl();
				reseed();
			},
			reseed: reseed,
			setLove: function () {
				settings.love = ask("LOVE (1-99)", settings.love, 1, 99);
				save();
				applyUrl();
			},
			setFps: function () {
				settings.fps = ask("FPS (10-240)", settings.fps, 10, 240);
				save();
				applyUrl();
			},
			toggleSabi: function () {
				settings.sabiMode = !settings.sabiMode;
				window.SaBiMode = settings.sabiMode;
				reloadIntoSettings();
			},
			toggleMusic: function () {
				if (settings.changeMusic)
					clearCustom("music", "changeMusic");
				else
					document.getElementById("musicPicker").click();
			},
			toggleSfx: function () {
				if (settings.changeSfx)
					clearCustom("sfx", "changeSfx");
				else
					document.getElementById("sfxPicker").click();
			}
		};

		document.getElementById("musicPicker").addEventListener("change", onPicked("music", "changeMusic"));
		document.getElementById("sfxPicker").addEventListener("change", onPicked("sfx", "changeSfx"));

		// The runtime must not start loading audio before the custom files are back.
		window.BadTimeAudioReady = readCustomAudio().catch(function () {});
	})();
	</script>

	<script>
	// The custom attack editor behind "Custom attack > Make attack".
	(function () {
		var draftKey = "badTimeAttackDraft";

		// Signatures come from Documentation/, corrected against the event sheets
		// where the two disagree (ANGLE takes the variable name first, and the

				["GasterBlaster", ["Size", "StartX", "StartY", "EndX", "EndY", "EndAngle", "SpinTime", "BlastTime"], "Move a blaster into place and fire it."],
				["Platform", ["X", "Y", "Width", "Direction", "Speed", "BooleanReverse"], "One platform."],
				["PlatformRepeat", ["StartX", "StartY", "Width", "Direction", "Speed", "Count", "Spacing"], "A row of platforms."],
				["HeartMode", ["Mode"], "0 red, 1 blue."],
				["HeartTeleport", ["X", "Y"], "Move the heart instantly."],
				["HeartMaxFallSpeed", ["MaxSpeed"], "Max fall speed in blue mode."]
			]],
			["Combat zone", [
				["CombatZoneSpeed", ["Speed"], "How fast the zone resizes."],
				["CombatZoneResize", ["Left", "Top", "Right", "Bottom", "FinishAction"], "Resize, then call FinishAction - usually TLResume."],
				["CombatZoneResizeInstant", ["Left", "Top", "Right", "Bottom"], "Resize with no animation."],
				["GetHeartPos", ["XVariableName", "YVariableName"], "Store the heart position in two variables."]
			]],
			["Maths", [
				["SET", ["VariableName", "Value"], "Set a variable. Read it back with $Name."],
				["ADD", ["VariableName", "Value1", "Value2"], "Value1 + Value2."],
				["SUB", ["VariableName", "Value1", "Value2"], "Value1 - Value2."],
				["MUL", ["VariableName", "Value1", "Value2"], "Value1 * Value2."],
				["DIV", ["VariableName", "Value1", "Value2"], "Value1 / Value2."],
				["MOD", ["VariableName", "Value1", "Value2"], "Value1 modulo Value2."],
				["FLOOR", ["VariableName", "Value"], "Round down."],
				["DEG", ["VariableName", "Radians"], "Radians to degrees."],
				["RAD", ["VariableName", "Degrees"], "Degrees to radians."],
				["SIN", ["VariableName", "Degrees"], "Sine of an angle in degrees."],
				["COS", ["VariableName", "Degrees"], "Cosine of an angle in degrees."],
				["ANGLE", ["VariableName", "Point1X", "Point1Y", "Point2X", "Point2Y"], "Angle from point 1 to point 2."],
				["RND", ["VariableName", "Number"], "Random whole number from 0 to Number-1."]
			]],
			["Jumps", [
				[":Label", ["LabelName"], "Not a command - a label you can jump to. Type it as :Name in the command column."],
				["JMPABS", ["LineOrLabel"], "Jump to a line number or label."],
				["JMPREL", ["RelativeLine"], "Jump forwards or backwards by a number of lines."],
				["JMPZ", ["LineOrLabel", "TestValue"], "Jump if the value is zero."],
				["JMPNZ", ["LineOrLabel", "TestValue"], "Jump if the value is not zero."],
				["JMPE", ["LineOrLabel", "TestValue1", "TestValue2"], "Jump if equal."],
				["JMPNE", ["LineOrLabel", "TestValue1", "TestValue2"], "Jump if not equal."],
				["JMPL", ["LineOrLabel", "TestValue1", "TestValue2"], "Jump if less."],
				["JMPNL", ["LineOrLabel", "TestValue1", "TestValue2"], "Jump if not less."],
				["JMPG", ["LineOrLabel", "TestValue1", "TestValue2"], "Jump if greater."],
				["JMPNG", ["LineOrLabel", "TestValue1", "TestValue2"], "Jump if not greater."]
			]]
		];

		var BY_NAME = {};
		COMMANDS.forEach(function (group) {
			group[1].forEach(function (command) {
				BY_NAME[command[0].toLowerCase()] = command;
			});
		});

		var TEMPLATE = [
			"0,CombatZoneResize,133,251,508,391,TLResume",
			"0,HeartTeleport,320,376",
			"0,HeartMode,0",
			"0,TLPause",
			"0.5,BoneVRepeat,128,257,95,0,180,6,120",
			"3,EndAttack",
			""
		].join("\n");

		var root = document.getElementById("attackMaker");
		var text = document.getElementById("amText");
		var status = document.getElementById("amStatus");
		var list = document.getElementById("amList");
		var help = document.getElementById("amHelp");
		var search = document.getElementById("amSearch");
		var preset = document.getElementById("amPreset");
		var filePicker = document.getElementById("amFile");
		var attackUrl = "";

		function renderList() {
			var needle = search.value.trim().toLowerCase();
			list.innerHTML = "";

			COMMANDS.forEach(function (group) {
				var matches = group[1].filter(function (command) {
					return !needle || command[0].toLowerCase().indexOf(needle) >= 0;
				});
				if (!matches.length)
					return;

				var heading = document.createElement("div");
				heading.className = "amGroup";
				heading.textContent = group[0];
				list.appendChild(heading);

				matches.forEach(function (command) {
					var button = document.createElement("button");
					button.type = "button";
					button.textContent = command[0];
					button.title = command[2];
					button.addEventListener("click", function () {
						describe(command);
						insert(command);
					});
					button.addEventListener("mouseenter", function () {
						describe(command);
					});
					list.appendChild(button);
				});
			});
		}

		function describe(command) {
			var signature = command[0] + (command[1].length ? "," + command[1].join(",") : "");
			help.innerHTML = "";
			var line = document.createElement("div");
			var name = document.createElement("b");
			name.textContent = "delay," + signature;
			line.appendChild(name);
			help.appendChild(line);
			var note = document.createElement("div");
			note.textContent = command[2];
			help.appendChild(note);
		}

		// Drop the row in as delay + placeholders, so it is obvious what is left
		// to fill in and the checker can point at anything still untouched.
		function insert(command) {
			var row = ["0", command[0]].concat(command[1]).join(",");
			if (command[0] === ":Label")
				row = "0,:LabelName";

			insertText(row);
			check();
		}

		function insertText(block) {
			var body = text.value;
			var lineEnd = body.indexOf("\n", text.selectionStart);
			if (lineEnd === -1)
				lineEnd = body.length;

			var head = body.slice(0, lineEnd);
			if (head && !head.endsWith("\n"))
				block = "\n" + block;

			text.value = head + block + body.slice(lineEnd);
			text.focus();
			text.selectionStart = text.selectionEnd = head.length + block.length;
		}

		function note(message, bad) {
			status.classList.toggle("bad", !!bad);
			status.textContent = message;
		}

		// Sans' own attacks sit next to the page as csv files, and offline.js
		// already lists every one of them, so the picker cannot go stale.
		function fillPresets() {
			if (preset.options.length > 1)
				return;

			fetch("offline.js").then(function (response) {
				return response.json();
			}).then(function (manifest) {
				manifest.fileList.filter(function (name) {
					return /\.csv$/i.test(name);
				}).forEach(function (name) {
					var option = document.createElement("option");
					option.value = name;
					option.textContent = name.replace(/\.csv$/i, "");
					preset.appendChild(option);
				});
			}).catch(function () {
				preset.options[0].textContent = "(could not list the built-in attacks)";
			});
		}

		function addPreset(name) {
			fetch(name).then(function (response) {
				if (!response.ok)
					throw new Error(response.status);
				return response.text();
			}).then(function (csv) {
				csv = csv.replace(/\r\n/g, "\n").replace(/\n+$/, "") + "\n";
				insertText(csv);
				saveDraft();
				check();
				note("added " + (csv.split("\n").length - 1) + " rows from " + name +
					" - check the EndAttack and any jumps by line number", false);
			}).catch(function () {
				note("could not read " + name, true);
			});
		}

		function check() {
			var lines = text.value.split(/\r?\n/);
			var problems = [];
			var labels = {};
			var jumps = [];
			var ends = false;

			lines.forEach(function (line, index) {
				if (!line.trim())
					return;

				var cells = line.split(",");
				var number = index + 1;
				var delay = cells[0].trim();
				var name = (cells[1] || "").trim();
				var args = cells.slice(2).map(function (cell) {
					return cell.trim();
				});
				while (args.length && args[args.length - 1] === "")
					args.pop();

				if (delay === "" || isNaN(Number(delay)))
					problems.push("line " + number + ": the first column is the delay in seconds, got \"" + cells[0] + "\"");

				if (name.charAt(0) === ":") {
					if (name.length < 2)
						problems.push("line " + number + ": a label needs a name after the colon");
					else
						labels[name.slice(1)] = true;
					return;
				}

				if (!name) {
					problems.push("line " + number + ": no command");
					return;
				}

				var command = BY_NAME[name.toLowerCase()];
				if (!command) {
					problems.push("line " + number + ": unknown command \"" + name + "\"");
					return;
				}

				if (name.toLowerCase() === "endattack")
					ends = true;

				// JMPREL is relative, everything else jumps to a line or a label.
				if (name.toLowerCase().indexOf("jmp") === 0 && name.toLowerCase() !== "jmprel" && args[0])
					jumps.push({ line: number, name: name, target: args[0] });

				var required = command[1].length;
				if (name === "Sound" || name === "SansText")
					required -= 1;   // the last argument is optional on these two
				if (args.length < required)
					problems.push("line " + number + ": " + name + " wants " + command[1].join(", "));

				var untouched = args.filter(function (value) {
					return command[1].indexOf(value) >= 0;
				});
				if (untouched.length)
					problems.push("line " + number + ": " + name + " still has placeholders - " + untouched.join(", "));
			});

			jumps.forEach(function (jump) {
				if (jump.target.charAt(0) === "$")
					return;
				if (/^[0-9]+$/.test(jump.target)) {
					var line = parseInt(jump.target, 10);
					if (line < 1 || line > lines.length)
						problems.push("line " + jump.line + ": " + jump.name + " goes to line " +
							line + ", which is outside the attack");
				} else if (!labels[jump.target]) {
					problems.push("line " + jump.line + ": " + jump.name + " goes to \"" +
						jump.target + "\", and there is no such label");
				}
			});

			if (!ends)
				problems.push("no EndAttack anywhere - the attack would never finish");

			status.classList.toggle("bad", problems.length > 0);
			if (!problems.length) {
				var rows = lines.filter(function (line) { return line.trim(); }).length;
				status.textContent = "looks fine - " + rows + " row" + (rows === 1 ? "" : "s");
			} else {
				status.textContent = problems.slice(0, 8).join("\n") +
					(problems.length > 8 ? "\n... and " + (problems.length - 8) + " more" : "");
			}

			return problems.length === 0;
		}

		function saveDraft() {
			try {
				localStorage.setItem(draftKey, text.value);
			} catch (e) {}
		}

		function open() {
			var draft = "";
			try {
				draft = localStorage.getItem(draftKey) || "";
			} catch (e) {}

			text.value = draft || TEMPLATE;
			root.classList.add("open");
			fillPresets();
			renderList();
			check();
			text.focus();
		}

		function close() {
			saveDraft();
			root.classList.remove("open");
		}

		// The runtime listens for keys on document, so stop anything typed in here
		// from also driving the menu behind the overlay.
		["keydown", "keyup", "keypress"].forEach(function (type) {
			root.addEventListener(type, function (event) {
				event.stopPropagation();
				if (type === "keydown" && event.key === "Escape") {
					event.preventDefault();
					close();
				}
			});
		});

		text.addEventListener("input", function () {
			check();
			saveDraft();
		});
		search.addEventListener("input", renderList);
		preset.addEventListener("change", function () {
			var name = this.value;
			this.selectedIndex = 0;
			if (name)
				addPreset(name);
		});

		document.getElementById("amClose").addEventListener("click", close);
		document.getElementById("amTemplate").addEventListener("click", function () {
			text.value = TEMPLATE;
			check();
			saveDraft();
			text.focus();
		});

		document.getElementById("amOpen").addEventListener("click", function () {
			filePicker.click();
		});
		filePicker.addEventListener("change", function () {
			var file = this.files && this.files[0];
			this.value = "";
			if (!file)
				return;

			var reader = new FileReader();
			reader.onload = function () {
				text.value = String(reader.result).replace(/\r\n/g, "\n");
				check();
				saveDraft();
			};
			reader.readAsText(file);
		});

		document.getElementById("amDownload").addEventListener("click", function () {
			var blob = new Blob([text.value], { type: "text/csv" });
			var url = URL.createObjectURL(blob);
			var link = document.createElement("a");
			link.href = url;
			link.download = "custom.csv";
			document.body.appendChild(link);
			link.click();
			document.body.removeChild(link);
			setTimeout(function () {
				URL.revokeObjectURL(url);
			}, 1000);
		});

		document.getElementById("amPlay").addEventListener("click", function () {
			if (!check() && !window.confirm("The attack has problems. Load it anyway?"))
				return;

			saveDraft();

			if (attackUrl)
				URL.revokeObjectURL(attackUrl);
			attackUrl = URL.createObjectURL(new Blob([text.value], { type: "text/csv" }));

			// The menu picks the URL up out of the query string and fetches it with
			// the same AJAX call the file chooser uses.
			window.BadTimeSettingsUI.sendCommand("attack", { attackurl: attackUrl });
			close();
		});

		window.BadTimeAttackMaker = {
			open: open,
			close: close,
			isOpen: function () {
				return root.classList.contains("open");
			}
		};
	})();
	</script>

		// Pause and resume on page becoming visible/invisible

		// Runtime calls this global method when ready to start caching (i.e. after startup).
